<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9eee4">
<title>火力発電所から家まで 3D</title><meta name="description" content="火力発電所から送電線・変電所・配電線・家の分電盤へ届く電気の流れを一望する3Dアニメーション。">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=20261019"><script defer src="./app.bundle.js?v=20261019"></script>
</head>
<body>
<main id="scene-wrap">
<canvas id="scene" tabindex="0" aria-label="火力発電所から送電線、変電所、配電線、家の分電盤につながる3Dモデル。ドラッグで回転、ホイールで拡大。設備をクリックすると拡大。矢印キーで回転、プラスとマイナスで拡大縮小、Homeで全景。"></canvas>
<div id="loading" role="status" aria-label="3Dを準備しています"><i></i></div>
<div class="playback" aria-label="アニメーション操作">
<div class="playback-row">
<button id="start" class="start"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg><span>スタート</span></button>
<button id="pause" class="square" aria-label="一時停止" title="一時停止" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
<span class="divider"></span>
<select id="speed" aria-label="再生速度" title="再生速度"><option value="0.5">0.5 ×</option><option value="1" selected>1 ×</option><option value="2">2 ×</option></select>
<button id="follow" class="square" aria-label="電気の流れにカメラを追従" title="電気の流れにカメラを追従" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/><circle cx="12" cy="12" r="3"/></svg></button>
<button id="overview" class="square" aria-label="全景に戻る" title="全景に戻る"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 12h8m-4-4v8"/></svg></button>
<button id="reset" class="square" aria-label="停止して最初に戻す" title="停止して最初に戻す"><svg viewBox="0 0 24 24"><path d="M5 9a8 8 0 1 1 0 7M5 4v5h5"/></svg></button>
</div>
<input id="timeline" type="range" min="0" max="36" step="0.01" value="0" aria-label="アニメーションの位置" disabled>
</div>
</main>
<noscript>JavaScriptを有効にしてください。</noscript>
</body>
</html>
