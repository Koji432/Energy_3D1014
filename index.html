<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9eee4">
<title>送電・配電　配電盤 3D</title><meta name="description" content="発電から送配電、家の分電盤まで。電圧の違いと3種類のブレーカーを動きで観察する3Dアプリ。">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=20261024a"><script defer src="./app.bundle.js?v=20261024a"></script>
</head>
<body>
<main id="scene-wrap">
<canvas id="scene" tabindex="0" aria-label="電気の流れを追う3Dモデル。設備を押して拡大。家を押すと分電盤のスイッチ操作。ドラッグで回転、ホイールで拡大。Homeで全景。"></canvas>
<div id="loading" role="status" aria-label="3Dを準備しています"><i></i></div>
<div id="journey-labels" class="annotations">
<div id="label-plant" class="annotation place"><span>火力発電所</span></div>
<div id="label-substation" class="annotation place"><span>変電所</span></div>
<button id="label-house" class="annotation place house-link" aria-label="家の中の分電盤を見る"><span>家</span></button>
</div>
<div id="board-labels" class="annotations" hidden>
<button id="board-amp" class="annotation breaker-label panel-switch" data-action="amp" aria-label="アンペアブレーカー" aria-pressed="true"><span>アンペア<br>ブレーカー</span></button>
<button id="board-rcd" class="annotation breaker-label panel-switch" data-action="rcd" aria-label="漏電遮断器を切る" aria-pressed="true"><span>漏電遮断器</span></button>
<div id="board-branch" class="annotation breaker-label"><span>配線用遮断器</span></div>
<button id="board-test" class="annotation test-button" data-action="test" aria-pressed="false">漏電テスト</button>
<button id="board-living" class="annotation load-label panel-switch" data-action="living" aria-label="居間の配線用遮断器" aria-pressed="true">居間</button>
<button id="board-kitchen" class="annotation load-label panel-switch" data-action="kitchen" aria-label="台所の配線用遮断器" aria-pressed="true">台所</button>
<button id="board-utility" class="annotation load-label panel-switch" data-action="utility" aria-label="洗面室の配線用遮断器" aria-pressed="true">洗面室</button>
</div>
<section id="lesson-panel" class="lesson-panel" aria-label="分電盤の操作" hidden>
<button id="back-journey" class="back-button">← 電気の流れに戻る</button>
<button id="panel-reset" class="panel-reset">リセット</button>
</section>
<div class="playback" aria-label="アニメーション操作">
<div class="playback-row">
<button id="start" class="start"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg><span>スタート</span></button>
<button id="pause" class="square" aria-label="一時停止" title="一時停止" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
<select id="speed" aria-label="再生速度" title="再生速度"><option value="0.5">0.5 ×</option><option value="1" selected>1 ×</option><option value="2">2 ×</option></select>
<button id="follow" class="square active" aria-label="電気の流れにカメラを追従" title="電気の流れにカメラを追従" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/><circle cx="12" cy="12" r="3"/></svg></button>
<button id="home" class="home-control" aria-label="家の中の分電盤を見る">家の中へ</button>
<button id="overview" class="square" aria-label="全景に戻る" title="全景に戻る"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 12h8m-4-4v8"/></svg></button>
<button id="reset" class="square" aria-label="停止して最初に戻す" title="停止して最初に戻す"><svg viewBox="0 0 24 24"><path d="M5 9a8 8 0 1 1 0 7M5 4v5h5"/></svg></button>
</div>
<input id="timeline" type="range" min="0" max="22" step="0.01" value="0" aria-label="アニメーションの位置" disabled>
</div>
</main>
<noscript>JavaScriptを有効にしてください。</noscript>
</body>
</html>
